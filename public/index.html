
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080811">
<title>VOID | Cyber AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#080811;color:#eee;
font-family:Arial,sans-serif;height:100dvh;
display:flex;flex-direction:column
}
header{
padding:18px 20px;border-bottom:1px solid #242239;
display:flex;align-items:center;gap:12px
}
.logo{
width:43px;height:43px;border-radius:14px;
background:linear-gradient(135deg,#a855f7,#5424c7);
display:grid;place-items:center;font-size:25px
}
.brand{font-size:21px;font-weight:bold;letter-spacing:2px}
.brand small{display:block;color:#9b91b5;font-size:10px}
main{
flex:1;overflow-y:auto;padding:22px 16px;
display:flex;flex-direction:column;gap:16px
}
.welcome{text-align:center;margin:auto;max-width:420px}
.welcome .symbol{font-size:65px;color:#a855f7}
.welcome h1{font-size:32px;letter-spacing:4px}
.welcome p{color:#999;line-height:1.8}
.message{
max-width:85%;padding:14px 17px;border-radius:17px;
line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere
}
.user{align-self:flex-start;background:#28213d}
.ai{align-self:flex-end;background:#151521;border:1px solid #30264a}
.error{border-color:#9b3434;color:#ffaaaa}
footer{padding:13px;border-top:1px solid #242239}
form{
max-width:850px;margin:auto;display:flex;gap:9px;
background:#171522;border:1px solid #39304e;
padding:9px;border-radius:17px
}
input{
flex:1;min-width:0;background:transparent;
border:0;outline:0;color:white;font-size:16px;padding:9px
}
button{
border:0;border-radius:12px;background:#873fe0;
color:white;padding:12px 17px;font-size:15px
}
button:disabled{opacity:.5}
.note{text-align:center;color:#777;font-size:11px;margin:9px}
</style>
</head>
<body>
<header>
<div class="logo">✧</div>
<div class="brand">VOID<small>CYBERSECURITY · AI</small></div>
</header>

<main id="messages">
<div class="welcome" id="welcome">
<div class="symbol">✧</div>
<h1>VOID</h1>
<p>مرحباً بك في VOID<br>
مساعدك الذكي للأمن السيبراني والبرمجة وكل شيء.</p>
</div>
</main>

<footer>
<form id="chatForm">
<input id="prompt" placeholder="اسأل VOID أي شيء..." autocomplete="off">
<button id="send" type="submit">إرسال</button>
</form>
<div class="note" id="status">VOID AI · استخدم المعرفة بمسؤولية</div>
</footer>

<script>
const form=document.getElementById('chatForm');
const input=document.getElementById('prompt');
const messages=document.getElementById('messages');
const send=document.getElementById('send');
const statusText=document.getElementById('status');

function addMessage(text,type){
const div=document.createElement('div');
div.className='message '+type;
div.textContent=text;
messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
return div;
}

form.addEventListener('submit',async e=>{
e.preventDefault();
const text=input.value.trim();
if(!text)return;

document.getElementById('welcome')?.remove();
addMessage(text,'user');
input.value='';
send.disabled=true;
statusText.textContent='VOID يفكر الآن...';

const reply=addMessage('جاري الاتصال بالذكاء الاصطناعي...','ai');

try{
const response=await fetch('/api/chat',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:text})
});

const raw=await response.text();
let data;

try{
data=JSON.parse(raw);
}catch{
throw new Error('استجابة غير مفهومة من الخادم: '+raw.slice(0,500));
}

if(!response.ok){
throw new Error(data.error||data.reply||'خطأ HTTP '+response.status);
}

let result=data.reply||data.output_text;

if(!result&&data.result){
const r=data.result;
result=r.response||r.output_text||r.text||
r.content||r.choices?.[0]?.message?.content||
JSON.stringify(r);
}

if(typeof result==='object')result=JSON.stringify(result,null,2);

if(!result){
throw new Error('الخادم رد بدون نص. البيانات: '+JSON.stringify(data).slice(0,1000));
}

reply.textContent=result;
statusText.textContent='VOID AI · متصل';

}catch(err){
reply.textContent='تفاصيل المشكلة:\n'+err.message;
reply.classList.add('error');
statusText.textContent='حدث خطأ في الاتصال';
}finally{
send.disabled=false;
input.focus();
}
});
</script>
</body>
</html>
